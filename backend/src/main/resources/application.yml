# Base configuration shared by every profile.
# Anything environment-specific is read from environment variables; secrets have NO defaults here.
# Local-only defaults live in application-local.yml.

spring:
  application:
    name: pawan-putra-business-os
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      pool-name: bos-hikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only verifies it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      key-prefix: "bos:cache:"
      time-to-live: 10m

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  threads:
    virtual:
      enabled: true

  task:
    scheduling:
      thread-name-prefix: bos-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
    com.pawanputra.bos: ${APP_LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
