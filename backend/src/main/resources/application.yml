# Base configuration shared by every profile.
# Anything environment-specific is read from environment variables; secrets have NO defaults here.
# Local-only defaults live in application-local.yml.

spring:
  application:
    name: pawan-putra-business-os
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      pool-name: bos-hikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only verifies it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      key-prefix: "bos:cache:"
      time-to-live: 10m

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  threads:
    virtual:
      enabled: true

  task:
    scheduling:
      thread-name-prefix: bos-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
    com.pawanputra.bos: ${APP_LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      # HMAC-SHA256 signing key, at least 32 characters. Changing it signs everyone out within the access-token TTL.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:pawan-putra-business-os}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    auth:
      # A session ends after this long without a refresh...
      refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:14d}
      # ...and in any case this long after sign-in.
      session-max-lifetime: ${AUTH_SESSION_MAX_LIFETIME:30d}
      password-reset-token-ttl: ${AUTH_PASSWORD_RESET_TOKEN_TTL:30m}
      max-failed-logins: ${AUTH_MAX_FAILED_LOGINS:5}
      lock-duration: ${AUTH_LOCK_DURATION:15m}
      # The refresh cookie is only sent over HTTPS. Turn off only for plain-http local development.
      cookie-secure: ${AUTH_COOKIE_SECURE:true}
    # Creates the first SUPER_ADMIN at start-up if (and only if) the database has no users.
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
      organization-code: ${BOOTSTRAP_ORGANIZATION_CODE:PPG}
      organization-name: ${BOOTSTRAP_ORGANIZATION_NAME:Pawan Putra}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
