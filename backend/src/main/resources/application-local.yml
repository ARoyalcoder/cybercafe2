# Developer machine. Defaults match docker-compose.yml so `mvnw spring-boot:run` works with no env vars.
# These credentials are for local containers only and must never be reused elsewhere.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bos}
    username: ${DB_USERNAME:bos}
    password: ${DB_PASSWORD:bos_local_dev}

  data:
    redis:
      password: ${REDIS_PASSWORD:bos_redis_local_dev}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.pawanputra.bos: ${APP_LOG_LEVEL:DEBUG}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:bos-local}
    access-key: ${STORAGE_ACCESS_KEY:bos_minio}
    secret-key: ${STORAGE_SECRET_KEY:bos_minio_local_dev}
